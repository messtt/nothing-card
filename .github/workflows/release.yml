name: Publication

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Joindre le bundle à la release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nothing-card.js
